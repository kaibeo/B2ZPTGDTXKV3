  return function Icon({ size = 16, className = "", strokeWidth = 2, ...rest }) {
    return React.createElement(
      "svg",
      {
        width: size, height: size, viewBox, fill: "none",
        stroke: "currentColor", strokeWidth, strokeLinecap: "round", strokeLinejoin: "round",
        className, ...rest
      },
      paths.map((d, i) => React.createElement("path", { key: i, d }))
    );
  };
}
function makeIconWithCircle(paths, circles = [], viewBox = "0 0 24 24") {
  return function Icon({ size = 16, className = "", strokeWidth = 2, ...rest }) {
    return React.createElement(
      "svg",
      {

        className, ...rest
      },

        ...circles.map((c, i) => React.createElement("circle", { key: "c" + i, cx: c[0], cy: c[1], r: c[2] }))

}

  function genLog(i) {
    const templates = [
      { l: "INFO", m: () => `Device ${randIp()} connected` },
      { l: "INFO", m: () => `Ping: ${(Math.random() * 20 + 1).toFixed(0)}ms` },

      { l: "WARNING", m: () => `Packet loss detected: ${(Math.random() * 3).toFixed(1)}%` },
    ];
    const t = templates[Math.floor(Math.random() * templates.length)];
    const now = new Date();
    const ts = now.toTimeString().slice(0, 8);
    return { id: i, time: ts, level: t.l, message: t.m() };

        </div>
      </Card>
    );

  function Sparkline({ data, color = RED, height = 44 }) {
    if (!data.length) return null;
    const max = Math.max(...data, 1);
    const min = Math.min(...data, 0);
    const range = max - min || 1;
    const w = 100;
    const pts = data.map((d, i) => {
      const x = (i / (data.length - 1)) * w;
      const y = height - ((d - min) / range) * (height - 6) - 3;
      return `${x},${y}`;
    }).join(" ");
    const areaPts = `0,${height} ${pts} ${w},${height}`;
    return (
      <svg viewBox={`0 0 ${w} ${height}`} className="w-full" style={{ height }} preserveAspectRatio="none">
        <polygon points={areaPts} fill={color} opacity="0.08" />
        <polyline points={pts} fill="none" stroke={color} strokeWidth="1.5" strokeLinejoin="round" strokeLinecap="round" />

    );
  }

      setError("");

      setLoading(true);
      setTimeout(() => {
        setLoading(false);
        if (username === "Tk Admin" && password === "admin1") {
          onLogin(username);

          setError("Incorrect username or password.");
        }
      }, 600);
    };

  /* ============================================================

     ============================================================ */

  function ConsolePage({ logs, setLogs, paused, setPaused }) {
    const [search, setSearch] = useState("");
    const [filter, setFilter] = useState("ALL");
    const [autoScroll, setAutoScroll] = useState(true);
    const bottomRef = useRef(null);

    useEffect(() => {
      if (autoScroll && bottomRef.current) bottomRef.current.scrollIntoView({ behavior: "smooth" });
    }, [logs, autoScroll]);

    const filtered = logs.filter(l =>
      (filter === "ALL" || l.level === filter) &&
      (search === "" || l.message.toLowerCase().includes(search.toLowerCase()))
    );

    const levelColor = { INFO: "text-gray-400", WARNING: "text-amber-400", ERROR: "text-red-400" };

    const exportLogs = () => {
      const blob = new Blob([logs.map(l => `[${l.time}] [${l.level}] ${l.message}`).join("\n")], { type: "text/plain" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url; a.download = "network-console-log.txt"; a.click();
      URL.revokeObjectURL(url);
    };

    return (
      <Card noPad className="overflow-hidden">
        <div className="flex flex-wrap items-center gap-2 p-3 border-b border-gray-100 bg-gray-50/60">
          <div className="relative flex-1 min-w-[160px]">
            <Search size={13} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400" />
            <input value={search} onChange={e => setSearch(e.target.value)} placeholder="Search log..."
              className="w-full pl-8 pr-2 py-1.5 text-[12.5px] rounded-md border border-gray-200 outline-none focus:border-red-300 bg-white" />
          </div>
          <select value={filter} onChange={e => setFilter(e.target.value)} className="text-[12.5px] border border-gray-200 rounded-md px-2 py-1.5 bg-white text-gray-600">
            <option value="ALL">All levels</option>
            <option value="INFO">INFO</option>
            <option value="WARNING">WARNING</option>
            <option value="ERROR">ERROR</option>
          </select>
          <button onClick={() => setPaused(p => !p)} className="flex items-center gap-1 text-[12.5px] px-2.5 py-1.5 rounded-md border border-gray-200 bg-white text-gray-600 hover:bg-gray-50">
            {paused ? <Play size={12} /> : <Pause size={12} />} {paused ? "Resume" : "Pause"}
          </button>
          <button onClick={() => setAutoScroll(a => !a)} className={`flex items-center gap-1 text-[12.5px] px-2.5 py-1.5 rounded-md border ${autoScroll ? "border-red-200 bg-red-50 text-red-700" : "border-gray-200 bg-white text-gray-600"}`}>
            <ChevronsUpDown size={12} /> Auto-scroll
          </button>
          <button onClick={exportLogs} className="flex items-center gap-1 text-[12.5px] px-2.5 py-1.5 rounded-md border border-gray-200 bg-white text-gray-600 hover:bg-gray-50">
            <Download size={12} /> Export
          </button>
          <button onClick={() => setLogs([])} className="flex items-center gap-1 text-[12.5px] px-2.5 py-1.5 rounded-md border border-gray-200 bg-white text-red-600 hover:bg-red-50">
            <Trash2 size={12} /> Clear
          </button>
        </div>
        <div className="bg-[#0B0D10] h-[480px] overflow-y-auto p-3.5 font-mono text-[12.5px] leading-relaxed">
          {filtered.length === 0 && <p className="text-gray-600">No log entries.</p>}
          {filtered.map(l => (
            <div key={l.id} className="whitespace-pre-wrap">
              <span className="text-gray-600">[{l.time}]</span>{" "}
              <span className={`${levelColor[l.level]} font-semibold`}>[{l.level}]</span>{" "}
              <span className="text-gray-300">{l.message}</span>
            </div>
          ))}
          <div ref={bottomRef} />
        </div>
      </Card>
    );
  }

  /* ============================================================
     DEVICES
     ============================================================ */

  function DevicesPage({ devices, setDevices, toast, confirm }) {
    const [search, setSearch] = useState("");
    const [statusFilter, setStatusFilter] = useState("ALL");
    const [selected, setSelected] = useState(null);
    const [page, setPage] = useState(1);
    const pageSize = 6;

    const filtered = devices.filter(d =>
      (statusFilter === "ALL" || d.status === statusFilter) &&
      (search === "" || d.name.toLowerCase().includes(search.toLowerCase()) || d.ip.includes(search))
    );
    const paged = filtered.slice((page - 1) * pageSize, page * pageSize);
    const totalPages = Math.max(1, Math.ceil(filtered.length / pageSize));

    const toggleBlock = (device) => {
      confirm({
        title: device.blocked ? "Unblock device?" : "Block this device?",
        body: `${device.blocked ? "Restore" : "Cut off"} network access for ${device.name} (${device.ip}).`,
        onConfirm: () => {
          setDevices(ds => ds.map(d => d.id === device.id ? { ...d, blocked: !d.blocked } : d));
          toast(`${device.name} ${device.blocked ? "unblocked" : "blocked"}.`, device.blocked ? "success" : "warn");
        }
      });
    };

    return (
      <div className="space-y-4">
        <Card noPad>
          <div className="flex flex-wrap items-center gap-2 p-3 border-b border-gray-100">
            <div className="relative flex-1 min-w-[160px]">
              <Search size={13} className="absolute left-2.5 top-1/2 -translate-y-1/2 text-gray-400" />
              <input value={search} onChange={e => { setSearch(e.target.value); setPage(1); }} placeholder="Search device or IP..."
                className="w-full pl-8 pr-2 py-1.5 text-[12.5px] rounded-md border border-gray-200 outline-none focus:border-red-300" />
            </div>
            <select value={statusFilter} onChange={e => { setStatusFilter(e.target.value); setPage(1); }} className="text-[12.5px] border border-gray-200 rounded-md px-2 py-1.5 text-gray-600">
              <option value="ALL">All status</option>
              <option value="online">Online</option>
              <option value="offline">Offline</option>
              <option value="warning">Warning</option>
            </select>
          </div>

          <div className="overflow-x-auto">
            <table className="w-full text-[13px]">
              <thead>
                <tr className="text-left text-gray-400 text-[11.5px] uppercase tracking-wide border-b border-gray-100">
                  <th className="px-4 py-2.5 font-medium">Device</th>
                  <th className="px-4 py-2.5 font-medium">IP / MAC</th>
                  <th className="px-4 py-2.5 font-medium">Type</th>
                  <th className="px-4 py-2.5 font-medium">Ping</th>
                  <th className="px-4 py-2.5 font-medium">Bandwidth</th>
                  <th className="px-4 py-2.5 font-medium">Status</th>
                  <th className="px-4 py-2.5 font-medium"></th>
                </tr>
              </thead>
              <tbody>
                {paged.map(d => (
                  <tr key={d.id} className="border-b border-gray-50 hover:bg-gray-50/60 transition">
                    <td className="px-4 py-3">
                      <button onClick={() => setSelected(d)} className="font-medium text-gray-800 hover:text-red-600 text-left">{d.name}</button>
                      <div className="flex gap-1 mt-1">
                        {d.tags?.map(t => <Badge key={t}>{t}</Badge>)}
                        {d.blocked && <Badge tone="red">blocked</Badge>}
                      </div>
                    </td>
                    <td className="px-4 py-3 text-gray-500">
                      <div>{d.ip}</div>
                      <div className="text-[11px] text-gray-400">{d.mac}</div>
                    </td>
                    <td className="px-4 py-3 text-gray-500">{d.type}</td>
                    <td className="px-4 py-3 text-gray-500">{d.ping !== null ? `${d.ping}ms` : "—"}</td>
                    <td className="px-4 py-3 text-gray-500">{d.bandwidth}</td>
                    <td className="px-4 py-3">
                      <span className="flex items-center gap-1.5">
                        <StatusDot status={d.status} />
                        <span className="capitalize text-gray-600 text-[12.5px]">{d.status}</span>
                      </span>
                    </td>
                    <td className="px-4 py-3 text-right">
                      <button onClick={() => toggleBlock(d)} className={`text-[12px] font-medium px-2.5 py-1 rounded-md ${d.blocked ? "text-emerald-700 hover:bg-emerald-50" : "text-red-600 hover:bg-red-50"}`}>
                        {d.blocked ? "Unblock" : "Block"}
                      </button>
                    </td>
                  </tr>
                ))}
                {paged.length === 0 && (
                  <tr><td colSpan={7} className="text-center py-10 text-gray-400 text-[13px]">No devices match your filters.</td></tr>
                )}
              </tbody>
            </table>
          </div>

          <div className="flex items-center justify-between px-4 py-3 border-t border-gray-100 text-[12.5px] text-gray-500">
            <span>{filtered.length} device{filtered.length !== 1 ? "s" : ""}</span>
            <div className="flex items-center gap-2">
              <button disabled={page === 1} onClick={() => setPage(p => p - 1)} className="px-2 py-1 rounded-md border border-gray-200 disabled:opacity-40">Prev</button>

  /* ============================================================
     ROOT APP
     ============================================================ */

  function App() {
    const [authed, setAuthed] = useState(false);
    const [user, setUser] = useState("");
    const [page, setPage] = useState("dashboard");
    const [sidebarOpen, setSidebarOpen] = useState(false);

    const [devices, setDevices] = useState(seedDevices);
    const [admins, setAdmins] = useState(seedAdmins);
    const [activity, setActivity] = useState(seedActivity);
    const [alerts, setAlerts] = useState(seedAlerts);
    const [services] = useState(seedServices);
    const [logs, setLogs] = useState(() => Array.from({ length: 12 }, (_, i) => genLog(i)));
    const [paused, setPaused] = useState(false);
    const logIdRef = useRef(12);

    const [toasts, setToasts] = useState([]);
    const toast = useCallback((msg, tone = "success") => {
      const id = Date.now();
      setToasts(t => [...t, { id, msg, tone }]);
      setTimeout(() => setToasts(t => t.filter(x => x.id !== id)), 3500);
    }, []);
    const removeToast = (id) => setToasts(t => t.filter(x => x.id !== id));

    const [confirmState, setConfirmState] = useState(null);
    const confirm = ({ title, body, onConfirm }) => setConfirmState({ title, body, onConfirm });

    const [metrics, setMetrics] = useState({
      cpu: 34, ram: 58, download: 62.4, upload: 18.2, ping: 12, latency: 14, packetLoss: 0.2, bandwidth: 210,
      alertCount: seedAlerts.filter(a => !a.read).length,
      downloadHistory: Array.from({ length: 30 }, () => 40 + Math.random() * 40),
      uploadHistory: Array.from({ length: 30 }, () => 10 + Math.random() * 20),
      pingHistory: Array.from({ length: 30 }, () => 8 + Math.random() * 20),
      packetLossHistory: Array.from({ length: 30 }, () => Math.random() * 2),
      cpuHistory: Array.from({ length: 30 }, () => 20 + Math.random() * 40),
      trafficHistory: Array.from({ length: 30 }, () => 150 + Math.random() * 100),
    });

    // realtime metric simulation
    useEffect(() => {
      if (!authed) return;
      const iv = setInterval(() => {
        setMetrics(m => {
          const next = (arr, base, spread) => [...arr.slice(1), Math.max(0, base + (Math.random() - 0.5) * spread)];
          return {
            ...m,
            cpu: Math.round(Math.max(5, Math.min(95, m.cpu + (Math.random() - 0.5) * 8))),
            ram: Math.round(Math.max(10, Math.min(95, m.ram + (Math.random() - 0.5) * 5))),
            download: +(Math.max(5, m.download + (Math.random() - 0.5) * 10)).toFixed(1),
            upload: +(Math.max(2, m.upload + (Math.random() - 0.5) * 4)).toFixed(1),
            ping: Math.max(1, Math.round(m.ping + (Math.random() - 0.5) * 4)),
            latency: Math.max(1, Math.round(m.latency + (Math.random() - 0.5) * 4)),
            packetLoss: +Math.max(0, (m.packetLoss + (Math.random() - 0.5) * 0.3)).toFixed(1),
            bandwidth: Math.round(Math.max(50, m.bandwidth + (Math.random() - 0.5) * 20)),
            downloadHistory: next(m.downloadHistory, m.download, 15),
            uploadHistory: next(m.uploadHistory, m.upload, 8),
            pingHistory: next(m.pingHistory, m.ping, 8),
            packetLossHistory: next(m.packetLossHistory, m.packetLoss, 1),
            cpuHistory: next(m.cpuHistory, m.cpu, 15),
            trafficHistory: next(m.trafficHistory, m.bandwidth, 40),
          };
        });
      }, 2000);
      return () => clearInterval(iv);
    }, [authed]);

    // realtime console log simulation
    useEffect(() => {
      if (!authed || paused) return;
      const iv = setInterval(() => {
        logIdRef.current += 1;
        setLogs(l => [...l.slice(-200), genLog(logIdRef.current)]);
      }, 2500);
      return () => clearInterval(iv);
    }, [authed, paused]);

    const handleLogin = (username) => {
      setUser(username);
      setAuthed(true);
      setActivity(a => [{ id: Date.now(), admin: username, action: "Logged in", ip: "192.168.1.5", time: new Date().toISOString().slice(0, 19).replace("T", " "), status: "success" }, ...a]);
      toast(`Welcome back, ${username}.`, "success");
    };

    const handleLogout = () => {
      setActivity(a => [{ id: Date.now(), admin: user, action: "Logged out", ip: "192.168.1.5", time: new Date().toISOString().slice(0, 19).replace("T", " "), status: "success" }, ...a]);
      setAuthed(false);
      setUser("");
    };

    if (!authed) return <LoginPage onLogin={handleLogin} />;

    return (
      <div className="min-h-screen bg-gray-50 flex" style={{ fontFamily: "'Inter', system-ui, sans-serif" }}>
        <Sidebar page={page} setPage={setPage} open={sidebarOpen} setOpen={setSidebarOpen} />
        <div className="flex-1 flex flex-col min-w-0">
          <Topbar pageTitle={PageTitleFor(page)} user={user} onLogout={handleLogout} setSidebarOpen={setSidebarOpen} alertCount={alerts.filter(a => !a.read).length} />
          <main className="flex-1 p-4 lg:p-6 max-w-[1400px] w-full mx-auto">
            {page === "dashboard" && <DashboardPage metrics={metrics} devices={devices} admins={admins} />}
            {page === "overview" && <OverviewPage metrics={metrics} devices={devices} />}
            {page === "devices" && <DevicesPage devices={devices} setDevices={setDevices} toast={toast} confirm={confirm} />}
            {page === "console" && <ConsolePage logs={logs} setLogs={setLogs} paused={paused} setPaused={setPaused} />}
            {page === "traffic" && <TrafficPage metrics={metrics} />}
            {page === "status" && <StatusPage services={services} />}
            {page === "alerts" && <AlertsPage alerts={alerts} setAlerts={setAlerts} />}
            {page === "logs" && <ActivityLogsPage activity={activity} />}
            {page === "accounts" && <AccountsPage admins={admins} setAdmins={setAdmins} toast={toast} confirm={confirm} />}
            {page === "permissions" && <PermissionsPage />}
            {["general", "sec-network", "security"].includes(page) && <SettingsPage tab={page} />}
          </main>
        </div>
        <Toast toasts={toasts} remove={removeToast} />
        <ConfirmModal
          open={!!confirmState}
          title={confirmState?.title}
          body={confirmState?.body}
          onCancel={() => setConfirmState(null)}
          onConfirm={() => { confirmState?.onConfirm(); setConfirmState(null); }}
        />
      </div>
    );
  }


  const root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(<App />);
});
</script>
</body>
</html>
