<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập | NetGuard</title>
<link rel="stylesheet" href="css/login.css">
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<defs>
<symbol id="ic-shield" viewBox="0 0 24 24"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 12l2 2 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs>
</svg>
<div class="login-box">
  <h1><svg width="26" height="26" style="vertical-align:-6px;stroke:currentColor;fill:none"><use href="#ic-shield"/></svg> NetGuard</h1>
  <p>Hệ thống quản lý mạng nội bộ</p>
  <div class="error-msg" id="errorMsg">Sai tài khoản hoặc mật khẩu!</div>
  <form id="loginForm">
    <div class="field">
      <label>Tên đăng nhập</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Mật khẩu</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pwToggle">HIỆN</button>
      </div>
    </div>
    <button type="submit" class="login-btn">Đăng nhập</button>
  </form>
  <div class="hint">Mặc định: admin / admin123</div>
</div>
<script src="js/auth.js"></script>
<script>
document.getElementById('pwToggle').addEventListener('click',()=>{
  const pw=document.getElementById('password');
  const btn=document.getElementById('pwToggle');
  if(pw.type==='password'){pw.type='text';btn.textContent='ẨN';}else{pw.type='password';btn.textContent='HIỆN';}
});
document.getElementById('loginForm').addEventListener('submit',(e)=>{
  e.preventDefault();
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  const res=Auth.login(u,p);
  if(res.ok){ window.location.href='index.html'; }
  else{
    const err=document.getElementById('errorMsg');
    err.textContent=res.msg;
    err.style.display='block';
  }
});
if(Auth.isLoggedIn()) window.location.href='index.html';
</script>
</body>
</html>
