<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<title>Đăng nhập | NetGuard</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#fff 0%,#fff5f5 100%)}
.login-box{background:#fff;border:1px solid #f0d0d0;border-radius:16px;padding:40px 36px;width:360px;box-shadow:0 10px 40px rgba(200,0,0,.08);animation:fadeIn .4s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:translateY(0)}}
.login-box h1{color:#c00;font-size:22px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.login-box p{color:#888;font-size:13px;margin-bottom:24px}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;color:#333;margin-bottom:6px;font-weight:600}
.field input{width:100%;padding:11px 12px;border:1px solid #ddd;border-radius:8px;font-size:14px;outline:none;transition:.2s}
.field input:focus{border-color:#c00;box-shadow:0 0 0 3px rgba(200,0,0,.08)}
.pw-wrap{position:relative}
.pw-wrap input{padding-right:40px}
.pw-toggle{position:absolute;right:10px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:13px;color:#c00;user-select:none;background:none;border:none}
.login-btn{width:100%;padding:12px;background:#c00;color:#fff;border:none;border-radius:8px;font-size:15px;font-weight:600;cursor:pointer;margin-top:8px;transition:.2s}
.login-btn:hover{background:#a00}
.error-msg{background:#fff0f0;color:#c00;border:1px solid #f0b0b0;padding:9px 12px;border-radius:8px;font-size:13px;margin-bottom:14px;display:none}
.hint{margin-top:18px;font-size:12px;color:#aaa;text-align:center}

</style>
</head>
<body>
<div class="login-box">
  <h1><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-6px;flex-shrink:0"><path d="M12 3l7 3v6c0 4.5-3 7.5-7 9-4-1.5-7-4.5-7-9V6l7-3z"/><path d="M9 12l2 2 4-4"/></svg> NetGuard</h1>
  <p>Hệ thống quản lý mạng nội bộ</p>
  <div class="error-msg" id="errorMsg">Sai tài khoản hoặc mật khẩu!</div>
  <form id="loginForm">
    <div class="field">
      <label>Tên đăng nhập</label>
      <input type="text" id="username" autocomplete="username" required>
    </div>
    <div class="field">
      <label>Mật khẩu</label>
      <div class="pw-wrap">
        <input type="password" id="password" autocomplete="current-password" required>
        <button type="button" class="pw-toggle" id="pwToggle">HIỆN</button>
      </div>
    </div>
    <button type="submit" class="login-btn">Đăng nhập</button>
  </form>
  <div class="hint">Mặc định: admin / admin123</div>
</div>
<script src="auth.js"></script>
<script>
document.getElementById('pwToggle').addEventListener('click',()=>{
  const pw=document.getElementById('password');
  const btn=document.getElementById('pwToggle');
  if(pw.type==='password'){pw.type='text';btn.textContent='ẨN';}else{pw.type='password';btn.textContent='HIỆN';}
});
document.getElementById('loginForm').addEventListener('submit',(e)=>{
  e.preventDefault();
  const u=document.getElementById('username').value.trim();
  const p=document.getElementById('password').value;
  const res=Auth.login(u,p);
  if(res.ok){ window.location.href='index.html'; }
  else{
    const err=document.getElementById('errorMsg');
    err.textContent=res.msg;
    err.style.display='block';
  }
});
if(Auth.isLoggedIn()) window.location.href='index.html';
</script>
</body>
</html>
